name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall app scripts
      - name: Format/lint
        run: python -m ruff check app scripts tests --select E9,F63,F7,F82
      - name: Type check
        run: python -m mypy app/config/config.py app/schemas/schemas.py --ignore-missing-imports --explicit-package-bases
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Build production image
        run: docker build --tag ai-customer:ci .
