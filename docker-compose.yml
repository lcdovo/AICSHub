name: ai-customer

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-customer_service}
      MYSQL_USER: ${MYSQL_APP_USER:-customer_service}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd --listen-client-urls=http://0.0.0.0:2379
      --advertise-client-urls=http://etcd:2379 --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    command: minio server /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10

  app:
    build:
      context: .
    image: ai-customer:latest
    environment:
      APP_NAME: ${APP_NAME:-智能客服系统}
      APP_VERSION: ${APP_VERSION:-1.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-integration}
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      HEALTHCHECK_TIMEOUT_SECONDS: ${HEALTHCHECK_TIMEOUT_SECONDS:-2}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_APP_USER:-customer_service}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-customer_service}
      DATABASE_URL_OVERRIDE: mysql+aiomysql://${MYSQL_APP_USER:-customer_service}:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-customer_service}
      USE_MILVUS: "true"
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
      AUTH_DEMO_ACCOUNTS_ENABLED: ${AUTH_DEMO_ACCOUNTS_ENABLED:-false}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-60}
      CHAT_MESSAGE_MAX_LENGTH: ${CHAT_MESSAGE_MAX_LENGTH:-5000}
      MAX_UPLOAD_FILE_BYTES: ${MAX_UPLOAD_FILE_BYTES:-5242880}
      MAX_BATCH_UPLOAD_FILES: ${MAX_BATCH_UPLOAD_FILES:-10}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_PROMPT_VERSION: ${LLM_PROMPT_VERSION:-v1}
      LLM_MODEL_VERSION: ${LLM_MODEL_VERSION:-gpt-4o-mini}
      LLM_SCHEMA_VERSION: ${LLM_SCHEMA_VERSION:-response.v1}
      LLM_ROUTE_VERSION: ${LLM_ROUTE_VERSION:-rules-first.v1}
      LLM_MAX_COST_USD: ${LLM_MAX_COST_USD:-0.05}
      LLM_DAILY_USER_TOKEN_BUDGET: ${LLM_DAILY_USER_TOKEN_BUDGET:-100000}
      LLM_DAILY_USER_COST_USD: ${LLM_DAILY_USER_COST_USD:-5}
      LLM_INPUT_PRICE_PER_1K_USD: ${LLM_INPUT_PRICE_PER_1K_USD:-0.00015}
      LLM_OUTPUT_PRICE_PER_1K_USD: ${LLM_OUTPUT_PRICE_PER_1K_USD:-0.00060}
      COLLECTION_NAME: ${COLLECTION_NAME:-customer_service_knowledge}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.2}
      RAG_USE_RERANKER: ${RAG_USE_RERANKER:-true}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      CHUNK_SPLIT_PATTERN: ${CHUNK_SPLIT_PATTERN:-heading}
      # Langfuse 外部观测（可选）：默认关闭，随 docker-compose.langfuse.yml 一起启用。
      # 容器内通过服务名 langfuse 访问自托管实例；本地非 Docker 运行使用 .env 的 LANGFUSE_HOST。
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_SAMPLING_RATE: ${LANGFUSE_SAMPLING_RATE:-1.0}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
