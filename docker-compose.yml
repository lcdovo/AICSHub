# AI Customer 全栈单一编排文件：主栈（mysql/redis/etcd/minio/milvus/app）默认启动，
# 可选栈用 compose profiles 按需启用：
#   docker compose up -d                                      # 仅主栈
#   docker compose --profile langfuse up -d                   # 主栈 + Langfuse 观测
#   docker compose --profile reranker up -d                   # 主栈 + 本地 reranker(bge-reranker-large)
#   docker compose --profile local-models up -d               # 主栈 + 本地 LLM/Embedding(vLLM/Ollama)
#   docker compose --profile local-embedding up -d            # 主栈 + 本地 Embedding，不启动本地 LLM
#   docker compose --profile langfuse,reranker,local-models up -d   # 全量
# 或直接运行 scripts\start.ps1 [-Langfuse] [-Reranker] [-LocalModels]（等价全开：start.ps1 -All）。
# 同一网络内服务名互通，应用侧地址配置见 .env（LLM_LOCAL_BASE/EMBEDDING_API_BASE/RERANKER_LOCAL_BASE）。

name: ai-customer

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-customer_service}
      MYSQL_USER: ${MYSQL_APP_USER:-customer_service}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd --listen-client-urls=http://0.0.0.0:2379
      --advertise-client-urls=http://etcd:2379 --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    command: minio server /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10

  app:
    build:
      context: .
    image: ai-customer:latest
    # API与后台索引进程必须共用Redis本地模型准入；增加worker仍需容量验收。
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${APP_WORKERS:-1}
    environment: &app-environment
      APP_NAME: ${APP_NAME:-智能客服系统}
      APP_VERSION: ${APP_VERSION:-1.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-integration}
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      HEALTHCHECK_TIMEOUT_SECONDS: ${HEALTHCHECK_TIMEOUT_SECONDS:-2}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_APP_USER:-customer_service}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-customer_service}
      DATABASE_URL_OVERRIDE: mysql+aiomysql://${MYSQL_APP_USER:-customer_service}:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-customer_service}
      USE_MILVUS: "true"
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      LOCAL_MODEL_COORDINATOR: ${LOCAL_MODEL_COORDINATOR:-redis}
      LOCAL_MODEL_MAX_CONCURRENCY: ${LOCAL_MODEL_MAX_CONCURRENCY:-1}
      RERANKER_LOCAL_BATCH_SIZE: ${RERANKER_LOCAL_BATCH_SIZE:-4}
      AGENT_TASK_DETERMINISTIC_ROUTING_ENABLED: ${AGENT_TASK_DETERMINISTIC_ROUTING_ENABLED:-false}
      LOCAL_MODEL_COORDINATOR_NAMESPACE: ${LOCAL_MODEL_COORDINATOR_NAMESPACE:-aicshub:local-models:whole-v1}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_THINKING_MODE: ${LLM_THINKING_MODE:-}
      LLM_STRUCTURED_OUTPUT_METHOD: ${LLM_STRUCTURED_OUTPUT_METHOD:-json_schema}
      LLM_BACKUP_BASE: ${LLM_BACKUP_BASE:-}
      LLM_BACKUP_KEY: ${LLM_BACKUP_KEY:-}
      LLM_BACKUP_MODEL: ${LLM_BACKUP_MODEL:-}
      # 解析型任务本地模型（意图识别+问题重写，vLLM）：base+model 配置齐才启用。
      LLM_LOCAL_BASE: ${LLM_LOCAL_BASE:-}
      LLM_LOCAL_KEY: ${LLM_LOCAL_KEY:-}
      LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-20}
      EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-unspecified}
      EMBEDDING_DOCUMENT_TIMEOUT_SECONDS: ${EMBEDDING_DOCUMENT_TIMEOUT_SECONDS:-60}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8100,http://127.0.0.1:8100}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
      AUTH_DEMO_ACCOUNTS_ENABLED: ${AUTH_DEMO_ACCOUNTS_ENABLED:-false}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-60}
      CHAT_MESSAGE_MAX_LENGTH: ${CHAT_MESSAGE_MAX_LENGTH:-5000}
      MAX_UPLOAD_FILE_BYTES: ${MAX_UPLOAD_FILE_BYTES:-5242880}
      MAX_BATCH_UPLOAD_FILES: ${MAX_BATCH_UPLOAD_FILES:-10}
      LLM_GENERATION_TEMPERATURE: ${LLM_GENERATION_TEMPERATURE:-0.7}
      CHAT_RUN_TIMEOUT_SECONDS: ${CHAT_RUN_TIMEOUT_SECONDS:-30}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-8}
      LLM_GATEWAY_ENABLED: ${LLM_GATEWAY_ENABLED:-false}
      REQUEST_UNDERSTANDING_MODE: ${REQUEST_UNDERSTANDING_MODE:-rules}
      REQUEST_UNDERSTANDING_VERSION: ${REQUEST_UNDERSTANDING_VERSION:-understanding.v1}
      REQUEST_UNDERSTANDING_PERCENTAGE: ${REQUEST_UNDERSTANDING_PERCENTAGE:-100}
      LLM_UNDERSTANDING_MAX_TOKENS: ${LLM_UNDERSTANDING_MAX_TOKENS:-500}
      AGENT_TASK_LOOP_ENABLED: ${AGENT_TASK_LOOP_ENABLED:-false}
      AGENT_ITEM_COMPLETION_ENABLED: ${AGENT_ITEM_COMPLETION_ENABLED:-false}
      LLM_JUDGE_ENABLED: ${LLM_JUDGE_ENABLED:-true}
      LLM_JUDGE_CONTRACT_VERSION: ${LLM_JUDGE_CONTRACT_VERSION:-v1}
      LLM_JUDGE_V2_OUTPUT_PROTOCOL: ${LLM_JUDGE_V2_OUTPUT_PROTOCOL:-function_calling}
      AGENT_TASK_REFUND_PREVIEW_ENABLED: ${AGENT_TASK_REFUND_PREVIEW_ENABLED:-false}
      AGENT_TASK_MAX_DECISIONS: ${AGENT_TASK_MAX_DECISIONS:-3}
      AGENT_TASK_MAX_TOOL_CALLS: ${AGENT_TASK_MAX_TOOL_CALLS:-4}
      AGENT_TASK_TIMEOUT_SECONDS: ${AGENT_TASK_TIMEOUT_SECONDS:-20}
      AGENT_TASK_MAX_OUTPUT_TOKENS: ${AGENT_TASK_MAX_OUTPUT_TOKENS:-256}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-inprocess}
      LLM_PRICE_VERIFIED: ${LLM_PRICE_VERIFIED:-false}
      LLM_PROMPT_VERSION: ${LLM_PROMPT_VERSION:-v1}
      LLM_MODEL_VERSION: ${LLM_MODEL_VERSION:-gpt-4o-mini}
      LLM_SCHEMA_VERSION: ${LLM_SCHEMA_VERSION:-response.v1}
      LLM_ROUTE_VERSION: ${LLM_ROUTE_VERSION:-rules-first.v1}
      LLM_MAX_COST_USD: ${LLM_MAX_COST_USD:-0.05}
      LLM_DAILY_USER_TOKEN_BUDGET: ${LLM_DAILY_USER_TOKEN_BUDGET:-100000}
      LLM_DAILY_USER_COST_USD: ${LLM_DAILY_USER_COST_USD:-5}
      LLM_INPUT_PRICE_PER_1K_USD: ${LLM_INPUT_PRICE_PER_1K_USD:-0.00015}
      LLM_OUTPUT_PRICE_PER_1K_USD: ${LLM_OUTPUT_PRICE_PER_1K_USD:-0.00060}
      COLLECTION_NAME: ${COLLECTION_NAME:-customer_service_knowledge}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_RERANK_K: ${RAG_RERANK_K:-8}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.2}
      RAG_USE_RERANKER: ${RAG_USE_RERANKER:-true}
      RERANKER_API_BASE: ${RERANKER_API_BASE:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      RERANKER_API_STYLE: ${RERANKER_API_STYLE:-openai}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-3}
      RERANKER_LOCAL_BASE: ${RERANKER_LOCAL_BASE:-}
      RERANKER_LOCAL_MODEL: ${RERANKER_LOCAL_MODEL:-BAAI/bge-reranker-large}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      CHUNK_SPLIT_PATTERN: ${CHUNK_SPLIT_PATTERN:-heading}
      # Langfuse 外部观测（可选，--profile langfuse 时启用）。
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_SAMPLING_RATE: ${LANGFUSE_SAMPLING_RATE:-1.0}
    ports:
      - "${APP_PORT:-8100}:8000"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: ai-customer:latest
    init: true
    command: python scripts/run_worker.py --poll 1 --limit 10
    stop_grace_period: 130s
    environment:
      <<: *app-environment
      LOCAL_MODEL_COORDINATOR: redis
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "scripts/run_worker.py", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ==================== Langfuse 自托管观测栈（--profile langfuse） ====================
  langfuse-db:
    profiles: ["langfuse"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD must be set}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    profiles: ["langfuse"]
    image: clickhouse/clickhouse-server:24.3
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD must be set}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password '${LANGFUSE_CLICKHOUSE_PASSWORD}' --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-minio-init:
    profiles: ["langfuse"]
    image: minio/mc
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin}
      ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set} &&
      mc mb --ignore-existing local/langfuse local/langfuse-media"

  langfuse:
    profiles: ["langfuse"]
    image: langfuse/langfuse:3
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      DIRECT_URL: postgresql://postgres:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET must be set}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT must be set}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY must be set}
      CLICKHOUSE_MIGRATION_URL: clickhouse://default:${LANGFUSE_CLICKHOUSE_PASSWORD}@langfuse-clickhouse:9000/default
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      # 首次启动自动创建组织/项目/管理员，项目 API key 即 .env 的 LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY。
      LANGFUSE_INIT_ORG_ID: ai-customer
      LANGFUSE_INIT_ORG_NAME: AI Customer
      LANGFUSE_INIT_PROJECT_ID: ai-customer
      LANGFUSE_INIT_PROJECT_NAME: AI Customer
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY must be set}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY must be set}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-admin@ai-customer.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_ADMIN_USERNAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?LANGFUSE_ADMIN_PASSWORD must be set}
      NODE_OPTIONS: --max-old-space-size=1024
    depends_on:
      langfuse-db: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      langfuse-minio-init: {condition: service_completed_successfully}
    restart: unless-stopped

  langfuse-worker:
    profiles: ["langfuse"]
    image: langfuse/langfuse-worker:3
    ports:
      - "3030:3030"
    environment:
      DATABASE_URL: postgresql://postgres:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      DIRECT_URL: postgresql://postgres:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET must be set}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT must be set}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY must be set}
      CLICKHOUSE_MIGRATION_URL: clickhouse://default:${LANGFUSE_CLICKHOUSE_PASSWORD}@langfuse-clickhouse:9000/default
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      NODE_OPTIONS: --max-old-space-size=1024
    depends_on:
      langfuse-db: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      langfuse-minio-init: {condition: service_completed_successfully}
    restart: unless-stopped

  # ==================== 本地模型栈（--profile reranker / local-models） ====================
  # 本地重排：同一bge-reranker-large via Infinity，GPU float32保留精度并满足本地截止。
  reranker:
    profiles: ["reranker"]
    image: michaelf34/infinity:latest
    # CPU小批推理禁用编译/全尺寸启动基准；就绪后仍需实际合成检索核验。
    command: v2 --model-id ${RERANKER_LOCAL_MODEL:-BAAI/bge-reranker-large} --device cuda --dtype float32 --port 7997 --batch-size 4 --no-compile --no-model-warmup
    ports:
      - "${RERANKER_LOCAL_PORT:-7997}:7997"
    environment:
      HF_ENDPOINT: https://hf-mirror.com
      # 限制CPU线程，避免与Ollama和业务栈争抢导致小批重排也超时。
      OMP_NUM_THREADS: ${RERANKER_CPU_THREADS:-2}
      MKL_NUM_THREADS: ${RERANKER_CPU_THREADS:-2}
    volumes:
      - reranker_hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7997/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 本地 LLM：Qwen3-4B-Instruct-2507-AWQ-4bit（意图识别+问题重写）via vLLM（GPU，8GB 卡独占）。
  # 纯文本模型（无视觉权重）；AWQ 4bit (compressed-tensors) 权重约 3.2GB；服务端关闭思考模式。
  # 应用侧 LLM_LOCAL_BASE=http://llm-local:8001/v1。
  llm-local:
    profiles: ["local-models", "local-llm"]
    image: vllm/vllm-openai:latest
    command: >
      --model ${LLM_LOCAL_MODEL_ID:-cyankiwi/Qwen3-4B-Instruct-2507-AWQ-4bit}
      --served-model-name qwen3-4b-awq
      --host 0.0.0.0
      --port 8001
      --max-model-len 4096
      --max-num-seqs 4
      --enforce-eager
      --reasoning-parser qwen3
      --default-chat-template-kwargs '{"enable_thinking": false}'
      --gpu-memory-utilization 0.65
    ports:
      - "${LLM_LOCAL_PORT:-8011}:8001"
    environment:
      HF_ENDPOINT: https://hf-mirror.com
      # WSL2（Docker Desktop）下默认禁用 pinned memory，导致 UVA is not available；
      # 官方开关开启后启用 pinned memory / UVA。
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      # hf-mirror 不代理 HF 的 Xet 分片存储（cas-server 401），禁用 Xet 回退普通 LFS 下载。
      HF_HUB_DISABLE_XET: "1"
      # hf-mirror 大文件下载易断连，调大超时并依赖 HF 断点续传。
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
    volumes:
      - vllm_hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 本机向量化：同一Qwen3-Embedding-0.6B权重通过GPU推理，避免CPU超过本地截止。
  # 应用侧 EMBEDDING_API_BASE=http://embedding-local:11434/v1；启动后需拉模型：
  #   docker exec ai-customer-embedding-local-1 ollama pull qwen3-embedding:0.6b
  embedding-local:
    profiles: ["local-models", "local-embedding"]
    image: ollama/ollama:latest
    # 首次加载模型可能需要十几秒；启动时预热，避免首个真实请求在应用的5秒本地模型预算内被截断。
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'ollama serve & pid=$$!;
      until ollama list >/dev/null 2>&1; do sleep 1; done;
      ollama run qwen3-embedding:0.6b "warmup" >/dev/null 2>&1 || true;
      wait $$pid'
    ports:
      - "${EMBEDDING_LOCAL_PORT:-8012}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      # 模型常驻内存，避免批量入库时批次间隔触发卸载/重载（默认 5 分钟后释放）。
      OLLAMA_KEEP_ALIVE: "-1"
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama ps | grep -q 'qwen3-embedding'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          # 限制分词等CPU任务，GPU设备仅由此可选profile申请。
          cpus: "4.0"

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  langfuse_pg_data:
  langfuse_clickhouse_data:
  # 复用既有权重缓存卷，避免合并后重新下载（vLLM 约 4.5GB / Ollama 约 0.6GB / reranker 约 1.3GB）。
  reranker_hf_cache:
    name: aicustomer_reranker_hf_cache
  vllm_hf_cache:
    name: aicustomer_vllm_hf_cache
  ollama_models:
    name: aicustomer_ollama_models
