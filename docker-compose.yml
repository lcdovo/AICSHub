name: ai-customer

services:
  # 本地演示：只启动应用，使用 SQLite + 内存检索 + Mock LLM。
  app-local:
    profiles: [local]
    build:
      context: .
      args:
        INSTALL_LOCAL_DEPS: "true"
    image: ai-customer:local
    environment:
      ENVIRONMENT: local
      DEBUG: "false"
      DATABASE_URL_OVERRIDE: sqlite+aiosqlite:///./data/customer_service.db
      USE_MILVUS: "false"
      MOCK_LLM_ENABLED: "true"
      REDIS_ENABLED: "false"
      AUTH_DEMO_ACCOUNTS_ENABLED: "true"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-user12345}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin12345}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-compose-secret-key-change-me-32chars}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - local_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # 以下服务只属于 integration profile；不会被本地一键演示拉起。
  mysql:
    profiles: [integration]
    image: mysql:8.0
    environment:
      # integration 必须通过 .env.integration 注入凭据；留空时 MySQL 会拒绝启动。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-customer_service}
      MYSQL_USER: ${MYSQL_APP_USER:-customer_service}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    profiles: [integration]
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    profiles: [integration]
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd --listen-client-urls=http://0.0.0.0:2379
      --advertise-client-urls=http://etcd:2379 --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    profiles: [integration]
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    command: minio server /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    profiles: [integration]
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10

  app-integration:
    profiles: [integration]
    build:
      context: .
      args:
        INSTALL_LOCAL_DEPS: "false"
    image: ai-customer:integration
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-integration}
      DEBUG: "false"
      DATABASE_URL_OVERRIDE: mysql+aiomysql://${MYSQL_APP_USER:-customer_service}:${MYSQL_APP_PASSWORD:-}@mysql:3306/${MYSQL_DATABASE:-customer_service}
      USE_MILVUS: "true"
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MOCK_LLM_ENABLED: ${MOCK_LLM_ENABLED:-false}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_DEMO_ACCOUNTS_ENABLED: "false"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  local_data:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
