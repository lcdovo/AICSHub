name: aicshub-gpu-candidates
# Standalone candidate stack. Never combine with the business docker-compose.yml.
# Current manually created candidate names are preserved; do not recreate them blindly.
services:
  embedding-gpu:
    image: ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
    container_name: aicshub-gpu-embedding-candidate
    labels:
      aicshub.test.owner: gpu-model-switch
    command: serve
    ports:
      - "127.0.0.1:8013:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-cache:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  reranker-gpu:
    image: michaelf34/infinity@sha256:11e8b3921b9f1a58965afaad4a844c435c9807cbc82c51e47cb147b7d977fc88
    container_name: aicshub-gpu-v2m3-candidate
    labels:
      aicshub.test.owner: gpu-model-switch
    command: ["v2", "--model-id", "BAAI/bge-reranker-v2-m3", "--device", "cuda", "--dtype", "float16", "--port", "7997", "--batch-size", "4", "--no-compile", "--no-model-warmup"]
    ports:
      - "127.0.0.1:7999:7997"
    environment:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - reranker-cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7997/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  ollama-cache:
    external: true
    name: aicustomer_ollama_models
  reranker-cache:
    external: true
    name: aicustomer_reranker_hf_cache
